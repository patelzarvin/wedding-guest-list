<!-- Royal Navy Blue & Champagne Gold Sacred Geometry Rotating Background -->
<div class="luxury-bg-decor" aria-hidden="true">

    <!-- Top-Right Rotating Royal Sacred Geometry Mandala -->
    <svg class="rotating-mandala-top" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="royalGlowTop" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="2.5" result="blur" />
                <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
            <linearGradient id="goldGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"   stop-color="#F3E5AB" />
                <stop offset="50%"  stop-color="#D4AF37" />
                <stop offset="100%" stop-color="#AA771C" />
            </linearGradient>
            <linearGradient id="navyAccent" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"   stop-color="#3B6FCC" stop-opacity="0.8" />
                <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.9" />
            </linearGradient>
        </defs>

        <g filter="url(#royalGlowTop)">
            <!-- Outer Beaded Orbit Rings -->
            <circle cx="300" cy="300" r="280" stroke="url(#goldGradTop)" stroke-width="1.8" stroke-dasharray="4 8" />
            <circle cx="300" cy="300" r="260" stroke="#D4AF37" stroke-width="1.6" />
            <circle cx="300" cy="300" r="240" stroke="url(#navyAccent)" stroke-width="1.4" stroke-dasharray="6 6" />

            <!-- 8-Point Sacred Interlocking Arcs -->
            <g stroke="#D4AF37" stroke-width="1.6">
                <circle cx="300" cy="180" r="120" stroke-opacity="0.9" />
                <circle cx="300" cy="420" r="120" stroke-opacity="0.9" />
                <circle cx="180" cy="300" r="120" stroke-opacity="0.9" />
                <circle cx="420" cy="300" r="120" stroke-opacity="0.9" />
                <circle cx="215" cy="215" r="120" stroke-opacity="0.85" />
                <circle cx="385" cy="215" r="120" stroke-opacity="0.85" />
                <circle cx="215" cy="385" r="120" stroke-opacity="0.85" />
                <circle cx="385" cy="385" r="120" stroke-opacity="0.85" />
            </g>

            <!-- Octagram Star -->
            <polygon points="300,70 345,210 490,210 375,295 420,435 300,350 180,435 225,295 110,210 255,210"
                stroke="url(#goldGradTop)" stroke-width="1.8" fill="none" />
            <polygon points="300,100 440,240 440,360 300,500 160,360 160,240"
                stroke="#D4AF37" stroke-width="1.6" stroke-dasharray="8 6" fill="none" />
            <polygon points="240,160 360,160 440,240 440,360 360,440 240,440 160,360 160,240"
                stroke="url(#navyAccent)" stroke-width="1.5" fill="none" />

            <!-- Core Rings -->
            <circle cx="300" cy="300" r="150" stroke="#D4AF37" stroke-width="1.8" />
            <circle cx="300" cy="300" r="110" stroke="url(#goldGradTop)" stroke-width="2.0" />
            <circle cx="300" cy="300" r="70"  stroke="#D4AF37" stroke-width="1.8" stroke-dasharray="3 5" />
            <circle cx="300" cy="300" r="35"  stroke="#D4AF37" stroke-width="2.0" />
            <circle cx="300" cy="300" r="10"  fill="#D4AF37" />

            <!-- 16 Radial Rays -->
            <g stroke="#D4AF37" stroke-width="1.6">
                <line x1="300" y1="20"  x2="300" y2="580" />
                <line x1="20"  y1="300" x2="580" y2="300" />
                <line x1="102" y1="102" x2="498" y2="498" />
                <line x1="102" y1="498" x2="498" y2="102" />
                <line x1="193" y1="41"  x2="407" y2="559" />
                <line x1="407" y1="41"  x2="193" y2="559" />
                <line x1="41"  y1="193" x2="559" y2="407" />
                <line x1="41"  y1="407" x2="559" y2="193" />
            </g>
        </g>
    </svg>

    <!-- Bottom-Left Counter-Rotating Mandala -->
    <svg class="rotating-mandala-bottom" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="royalGlowBottom" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
            <linearGradient id="goldGradBottom" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%"   stop-color="#F3E5AB" />
                <stop offset="50%"  stop-color="#D4AF37" />
                <stop offset="100%" stop-color="#AA771C" />
            </linearGradient>
        </defs>

        <g filter="url(#royalGlowBottom)">
            <circle cx="300" cy="300" r="270" stroke="#D4AF37" stroke-width="1.8" stroke-dasharray="5 7" />
            <circle cx="300" cy="300" r="230" stroke="url(#goldGradBottom)" stroke-width="1.8" />
            <circle cx="300" cy="300" r="180" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4 6" />

            <!-- Interlocking Hexagons -->
            <polygon points="300,70 499,185 499,415 300,530 101,415 101,185"
                stroke="url(#goldGradBottom)" stroke-width="1.8" fill="none" />
            <polygon points="300,530 101,415 101,185 300,70 499,185 499,415"
                transform="rotate(30 300 300)" stroke="#D4AF37" stroke-width="1.6" stroke-dasharray="6 6" fill="none" />
            <polygon points="300,110 464,205 464,395 300,490 136,395 136,205"
                stroke="#D4AF37" stroke-width="1.6" fill="none" />

            <!-- Core Rings -->
            <circle cx="300" cy="300" r="130" stroke="#D4AF37" stroke-width="1.8" />
            <circle cx="300" cy="300" r="80"  stroke="url(#goldGradBottom)" stroke-width="2.0" />
            <circle cx="300" cy="300" r="30"  stroke="#D4AF37" stroke-width="1.8" stroke-dasharray="3 4" />
            <circle cx="300" cy="300" r="8"   fill="#D4AF37" />

            <!-- Cross Rays -->
            <g stroke="#D4AF37" stroke-width="1.6">
                <line x1="300" y1="30"  x2="300" y2="570" />
                <line x1="30"  y1="300" x2="570" y2="300" />
                <line x1="109" y1="109" x2="491" y2="491" />
                <line x1="109" y1="491" x2="491" y2="109" />
            </g>
        </g>
    </svg>

    <!-- Floating Gold Micro-Particles -->
    <div class="luxury-particle" style="width:4px;height:4px;top:20%;left:15%;--dur:7s;--delay:0s;"></div>
    <div class="luxury-particle" style="width:3px;height:3px;top:35%;left:80%;--dur:9s;--delay:1s;"></div>
    <div class="luxury-particle" style="width:5px;height:5px;top:70%;left:30%;--dur:6s;--delay:2s;"></div>
    <div class="luxury-particle" style="width:3px;height:3px;top:55%;left:65%;--dur:11s;--delay:0.5s;"></div>
    <div class="luxury-particle" style="width:4px;height:4px;top:80%;left:85%;--dur:8s;--delay:3s;"></div>
    <div class="luxury-particle" style="width:2px;height:2px;top:10%;left:50%;--dur:10s;--delay:1.5s;"></div>

    <!-- Ambient Glow Spots -->
    <div class="luxury-glow-spot glow-spot-1"></div>
    <div class="luxury-glow-spot glow-spot-2"></div>
    <div class="luxury-glow-spot glow-spot-3"></div>
</div>
