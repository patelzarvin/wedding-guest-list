<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aisle &amp; Vows - Wedding Suite Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0c1017;
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* Bokeh Background Accents matching Theme 2 */
        .bokeh-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }
        .bokeh {
            position: absolute;
            border-radius: 50%;
            filter: blur(85px);
            opacity: 0.5;
        }
        .b1 { width: 360px; height: 360px; background: radial-gradient(circle, #E5C158 0%, rgba(212,175,55,0.15) 60%, transparent 80%); top: 50px; right: 12%; }
        .b2 { width: 460px; height: 460px; background: radial-gradient(circle, #D4AF37 0%, rgba(229,193,88,0.1) 60%, transparent 80%); bottom: 50px; left: 10%; }
        .b3 { width: 260px; height: 260px; background: radial-gradient(circle, #FFDF78 0%, rgba(255,215,0,0.12) 60%, transparent 80%); top: 40%; left: 30%; }

        /* Central Glass Card matching Screen 2 */
        .auth-card {
            width: 100%;
            max-width: 460px;
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1.5px solid rgba(229, 193, 88, 0.4);
            border-radius: 28px;
            padding: 40px 36px 36px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), 0 0 35px rgba(229, 193, 88, 0.2);
            position: relative;
            z-index: 10;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .auth-logo {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: 0.5px;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 6px;
        }
        .auth-logo span { color: #E5C158; font-style: italic; }
        .auth-subtitle {
            font-size: 13px;
            color: #94A3B8;
        }

        /* Tabs matching Screen 2 */
        .tabs-header {
            display: flex;
            border-bottom: 1.5px solid rgba(229, 193, 88, 0.2);
            margin-bottom: 26px;
            position: relative;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 16px;
            background: transparent;
            border: none;
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 600;
            color: #94A3B8;
            cursor: pointer;
            transition: color 0.25s;
            position: relative;
            text-align: center;
        }
        .tab-btn.active {
            color: #FFFFFF;
            font-weight: 700;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1.5px;
            left: 20%;
            right: 20%;
            height: 3px;
            background: #E5C158;
            border-radius: 3px;
            box-shadow: 0 0 10px #E5C158;
        }

        .form-section { display: none; }
        .form-section.active { display: block; }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #CBD5E1;
            margin-bottom: 7px;
        }
        .input-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(229, 193, 88, 0.25);
            border-radius: 12px;
            padding: 13px 16px;
            font-size: 14px;
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-box:focus {
            border-color: #E5C158;
            box-shadow: 0 0 15px rgba(229, 193, 88, 0.25);
            background: rgba(255, 255, 255, 0.08);
        }
        .input-box::placeholder { color: #64748B; }

        .remember-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #94A3B8;
            margin-bottom: 24px;
        }
        .remember-row label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .remember-row input[type="checkbox"] {
            accent-color: #E5C158;
            width: 16px; height: 16px;
        }
        .remember-row a {
            color: #E5C158;
            text-decoration: none;
        }
        .remember-row a:hover { text-decoration: underline; }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #E5C158 0%, #C49836 100%);
            color: #0E1218;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(229, 193, 88, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(229, 193, 88, 0.55);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #EF4444;
            color: #FCA5A5;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }
        .alert-error.client-banner {
            display: none;
            animation: shake 0.3s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .alert-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid #22C55E;
            color: #86EFAC;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }

        /* Password Input Wrapper with Eye Toggle */
        .password-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrap .input-box {
            padding-right: 44px;
        }
        .toggle-pwd-btn {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            color: #94A3B8;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            user-select: none;
        }
        .toggle-pwd-btn:hover {
            color: #E5C158;
        }

        /* Password Strength Bar & Hints */
        .pwd-strength-container {
            margin-top: 8px;
            display: none;
        }
        .pwd-strength-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 5px;
        }
        .pwd-strength-fill {
            height: 100%;
            width: 0%;
            border-radius: 2px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        .pwd-strength-label {
            font-size: 11px;
            color: #94A3B8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pwd-hint-text {
            font-size: 11px;
            color: #94A3B8;
            margin-top: 5px;
            display: block;
        }
        .pwd-hint-text.error {
            color: #F87171;
            font-weight: 600;
        }
        .pwd-hint-text.success {
            color: #4ADE80;
            font-weight: 600;
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #64748B;
            border-top: 1px solid rgba(229, 193, 88, 0.15);
            padding-top: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .secure-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #E5C158;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="bokeh-container">
        <div class="bokeh b1"></div>
        <div class="bokeh b2"></div>
        <div class="bokeh b3"></div>
    </div>

    <div class="auth-card">
        <div class="auth-header">
            <a href="/" class="auth-logo">Aisle &amp; Vows <span>Weddings</span></a>
            <div class="auth-subtitle">Intelligent Wedding Guest Management Software</div>
        </div>

        {% if error %}
            <div class="alert-error">{{ error }}</div>
        {% endif %}
        {% if success %}
            <div class="alert-success">{{ success }}</div>
        {% endif %}

        <div id="clientErrorBanner" class="alert-error client-banner"></div>

        <!-- Tabs Header -->
        <div class="tabs-header">
            <button type="button" class="tab-btn {% if active_tab != 'register' %}active{% endif %}" onclick="switchTab('signin')">Sign In</button>
            <button type="button" class="tab-btn {% if active_tab == 'register' %}active{% endif %}" onclick="switchTab('register')">Create Account</button>
        </div>

        <!-- Sign In Form -->
        <div id="signin-section" class="form-section {% if active_tab != 'register' %}active{% endif %}">
            <form action="/login" method="POST" onsubmit="return validateSignInForm(event)">
                <input type="hidden" name="action" value="login">
                <div class="form-group">
                    <label>Username / Email</label>
                    <input type="text" name="username" id="signin_username" class="input-box" placeholder="Enter your username or email" required autofocus>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrap">
                        <input type="password" name="password" id="signin_password" class="input-box" placeholder="Enter your password" required>
                        <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('signin_password', this)" title="Show/Hide Password" aria-label="Toggle password visibility">👁️</button>
                    </div>
                </div>
                <div class="remember-row">
                    <label><input type="checkbox" name="remember" checked> Remember My Family</label>
                    <a href="javascript:void(0)" onclick="alert('Please contact your administrator or register a new family account.')">Forgot Password?</a>
                </div>
                <button type="submit" class="btn-submit" id="signinSubmitBtn">Sign In to Dashboard &rarr;</button>
            </form>
        </div>

        <!-- Create Account Form -->
        <div id="register-section" class="form-section {% if active_tab == 'register' %}active{% endif %}">
            <form action="/register" method="POST" id="registerForm" onsubmit="return validateRegisterForm(event)">
                <input type="hidden" name="action" value="register">
                <div class="form-group">
                    <label>Choose Username (ઓછામાં ઓછા 3 અક્ષર)</label>
                    <input type="text" name="username" id="reg_username" class="input-box" placeholder="e.g. patel_family" required minlength="3">
                </div>
                <div class="form-group">
                    <label>Email Address (ઇમેઇલ એડ્રેસ)</label>
                    <input type="email" name="email" id="reg_email" class="input-box" placeholder="e.g. host@wedding.com" required>
                </div>
                <div class="form-group">
                    <label>Create Password (નવો પાસવર્ડ - Min 6 Characters)</label>
                    <div class="password-wrap">
                        <input type="password" name="password" id="reg_password" class="input-box" placeholder="Create strong password" required minlength="6" oninput="handlePasswordStrength(this)">
                        <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('reg_password', this)" title="Show/Hide Password" aria-label="Toggle password visibility">👁️</button>
                    </div>
                    <!-- Password Strength Meter -->
                    <div class="pwd-strength-container" id="strengthContainer">
                        <div class="pwd-strength-bar">
                            <div class="pwd-strength-fill" id="strengthFill"></div>
                        </div>
                        <div class="pwd-strength-label">
                            <span id="strengthText">Strength: Weak</span>
                            <span id="charCount">0/6 chars</span>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password (પાસવર્ડ ફરીથી લખો)</label>
                    <div class="password-wrap">
                        <input type="password" name="confirm_password" id="reg_confirm_password" class="input-box" placeholder="Re-enter password to confirm" required oninput="handlePasswordMatch()">
                        <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('reg_confirm_password', this)" title="Show/Hide Password" aria-label="Toggle password visibility">👁️</button>
                    </div>
                    <span class="pwd-hint-text" id="confirmHint"></span>
                </div>
                <button type="submit" class="btn-submit" id="regSubmitBtn">Create Wedding Suite &rarr;</button>
            </form>
        </div>

        <div class="auth-footer">
            <span class="secure-badge">&#128274; 256-Bit SSL Encrypted</span>
            <span>&bull;</span>
            <span>Protected Guest Data</span>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            clearClientError();
            if (tab === 'signin') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('signin-section').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('register-section').classList.add('active');
            }
        }

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
                btn.title = 'Hide Password';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
                btn.title = 'Show Password';
            }
        }

        function handlePasswordStrength(input) {
            const val = input.value;
            const container = document.getElementById('strengthContainer');
            const fill = document.getElementById('strengthFill');
            const label = document.getElementById('strengthText');
            const count = document.getElementById('charCount');

            if (!val) {
                container.style.display = 'none';
                return;
            }
            container.style.display = 'block';
            count.textContent = `${val.length} chars (min 6)`;

            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 8) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[A-Z]/.test(val) || /[^A-Za-z0-9]/.test(val)) score++;

            if (val.length < 6) {
                fill.style.width = '25%';
                fill.style.backgroundColor = '#EF4444';
                label.textContent = '⚠️ બહુ ટૂંકો છે (Too Short - min 6)';
                label.style.color = '#FCA5A5';
            } else if (score === 1) {
                fill.style.width = '40%';
                fill.style.backgroundColor = '#F59E0B';
                label.textContent = 'સામાન્ય પાસવર્ડ (Weak)';
                label.style.color = '#FCD34D';
            } else if (score === 2 || score === 3) {
                fill.style.width = '75%';
                fill.style.backgroundColor = '#E5C158';
                label.textContent = 'મજબૂત પાસવર્ડ (Good)';
                label.style.color = '#F6D87A';
            } else {
                fill.style.width = '100%';
                fill.style.backgroundColor = '#22C55E';
                label.textContent = 'ઉત્તમ પાસવર્ડ (Very Strong)';
                label.style.color = '#86EFAC';
            }

            handlePasswordMatch();
        }

        function handlePasswordMatch() {
            const pwd = document.getElementById('reg_password').value;
            const conf = document.getElementById('reg_confirm_password').value;
            const hint = document.getElementById('confirmHint');

            if (!conf) {
                hint.textContent = '';
                hint.className = 'pwd-hint-text';
                return;
            }

            if (pwd === conf) {
                hint.textContent = '✓ પાસવર્ડ સરખા છે (Passwords match)';
                hint.className = 'pwd-hint-text success';
            } else {
                hint.textContent = '✕ પાસવર્ડ મેચ થતા નથી (Passwords do not match)';
                hint.className = 'pwd-hint-text error';
            }
        }

        function showClientError(msg, targetInput) {
            const banner = document.getElementById('clientErrorBanner');
            banner.textContent = msg;
            banner.style.display = 'block';
            if (targetInput) {
                targetInput.focus();
                targetInput.style.borderColor = '#EF4444';
                setTimeout(() => { targetInput.style.borderColor = ''; }, 3000);
            }
        }

        function clearClientError() {
            const banner = document.getElementById('clientErrorBanner');
            banner.style.display = 'none';
            banner.textContent = '';
        }

        function validateRegisterForm(e) {
            clearClientError();
            const username = document.getElementById('reg_username').value.trim();
            const email = document.getElementById('reg_email').value.trim();
            const pwdInput = document.getElementById('reg_password');
            const confInput = document.getElementById('reg_confirm_password');
            const pwd = pwdInput.value;
            const conf = confInput.value;

            if (username.length < 3) {
                e.preventDefault();
                showClientError('⚠️ યુઝરનેમ ઓછામાં ઓછા 3 અક્ષરનું હોવું જોઈએ. (Username must be at least 3 chars)', document.getElementById('reg_username'));
                return false;
            }

            if (pwd.length < 6) {
                e.preventDefault();
                showClientError('⚠️ પાસવર્ડ ઓછામાં ઓછા 6 અક્ષરનો હોવો જોઈએ! (Password must be at least 6 characters)', pwdInput);
                return false;
            }

            if (pwd !== conf) {
                e.preventDefault();
                showClientError('⚠️ પાસવર્ડ અને Confirm Password મેચ થતા નથી! કૃપા કરીને ચકાસો.', confInput);
                return false;
            }

            const btn = document.getElementById('regSubmitBtn');
            btn.disabled = true;
            btn.textContent = '⏳ એકાઉન્ટ બની રહ્યું છે... (Creating...)';
            return true;
        }

        function validateSignInForm(e) {
            clearClientError();
            const user = document.getElementById('signin_username').value.trim();
            const pass = document.getElementById('signin_password').value;

            if (!user) {
                e.preventDefault();
                showClientError('⚠️ કૃપા કરીને યુઝરનેમ અથવા ઇમેઇલ દાખલ કરો.', document.getElementById('signin_username'));
                return false;
            }
            if (!pass) {
                e.preventDefault();
                showClientError('⚠️ કૃપા કરીને પાસવર્ડ દાખલ કરો.', document.getElementById('signin_password'));
                return false;
            }

            const btn = document.getElementById('signinSubmitBtn');
            btn.disabled = true;
            btn.textContent = '⏳ સાઇન ઇન થઈ રહ્યું છે... (Signing in...)';
            return true;
        }
    </script>
</body>
</html>
