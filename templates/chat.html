<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{ contact.name }} - લગ્ન આમંત્રણ &amp; RSVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Hind+Vadodara:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/luxury_theme.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            background: #020704;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: stretch;
            font-family: 'Plus Jakarta Sans', 'Hind Vadodara', sans-serif;
        }

        /* Mobile Container: Full viewport height with dynamic support */
        .chat-app-container {
            width: 100%;
            max-width: 520px;
            height: 100%;
            height: 100dvh;
            max-height: 100dvh;
            background: var(--bg-obsidian);
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--gold-border);
            border-right: 1px solid var(--gold-border);
            position: relative;
            z-index: 10;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.85);
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            flex-shrink: 0;
            background: var(--bg-forest-card);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1.5px solid var(--gold-border);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 20;
        }
        .avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, #F3E5AB 0%, #D4AF37 50%, #B8860B 100%);
            color: #040906;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--gold-glow);
            flex-shrink: 0;
        }
        .avatar svg {
            width: 22px;
            height: 22px;
            color: #040906;
        }
        .header-info h2 {
            font-size: 15px;
            font-weight: 700;
            color: #FFFFFF;
            line-height: 1.3;
        }
        .header-info p {
            font-size: 11px;
            color: #34D399;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 2px;
        }
        .online-dot {
            width: 7px; height: 7px; border-radius: 50%; background: #10B981;
            box-shadow: 0 0 6px #10B981;
        }

        /* Chat History Area: Takes all remaining space and scrolls smoothly */
        .chat-history {
            flex: 1 1 auto;
            min-height: 0;
            padding: 16px 14px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: radial-gradient(circle at 50% 20%, #0A2216 0%, #020704 100%);
            -webkit-overflow-scrolling: touch;
        }

        .bubble {
            max-width: 86%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 13.5px;
            line-height: 1.55;
            position: relative;
            word-wrap: break-word;
        }
        .bubble-bot {
            align-self: flex-start;
            background: rgba(10, 30, 20, 0.95);
            color: var(--text-creamy);
            border: 1px solid var(--gold-border);
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        .bubble-user {
            align-self: flex-end;
            background: linear-gradient(135deg, #F3E5AB 0%, #D4AF37 50%, #B8860B 100%);
            color: #040906;
            font-weight: 600;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
        }
        .bubble-time {
            font-size: 10px;
            margin-top: 5px;
            display: block;
            text-align: right;
            opacity: 0.7;
        }

        /* Quick Replies Bar */
        .quick-replies-bar {
            flex-shrink: 0;
            padding: 10px 14px;
            display: flex;
            gap: 10px;
            background: var(--bg-forest-card);
            border-top: 1px solid var(--gold-border);
            justify-content: center;
        }
        .quick-chip {
            flex: 1;
            background: linear-gradient(135deg, #F3E5AB 0%, #D4AF37 50%, #B8860B 100%);
            color: #040906;
            font-size: 13.5px;
            font-weight: 700;
            padding: 10px 16px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: transform 0.1s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .quick-chip:active {
            transform: scale(0.96);
        }
        .quick-chip-outline {
            background: rgba(10, 30, 20, 0.65);
            border: 1px solid var(--gold-border);
            color: var(--gold-champagne);
            box-shadow: none;
        }

        /* Input Form Bar: Guaranteed visible on all mobile viewports */
        .input-bar {
            flex-shrink: 0;
            padding: 10px 14px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            background: rgba(4, 15, 9, 0.98);
            border-top: 1px solid var(--gold-border);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 30;
        }
        .text-input {
            flex: 1;
            background: var(--bg-forest-input);
            border: 1px solid var(--gold-border);
            border-radius: 25px;
            padding: 11px 18px;
            font-size: 14px;
            color: #FFFFFF;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .text-input:focus {
            border-color: var(--gold-hover);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.25);
            background: rgba(2, 8, 5, 0.9);
        }
        .btn-send {
            width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(135deg, #F3E5AB 0%, #D4AF37 50%, #B8860B 100%);
            border: none;
            color: #040906;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px var(--gold-glow);
            flex-shrink: 0;
            transition: transform 0.15s ease;
        }
        .btn-send:active {
            transform: scale(0.92);
        }
        .btn-send svg {
            width: 18px;
            height: 18px;
            stroke: #040906;
            margin-left: 2px;
        }
    </style>
</head>
<body>
    {% include 'luxury_bg.html' %}

    <div class="chat-app-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="avatar" title="Wedding Concierge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="7"></circle>
                    <polyline points="12 9 12 12 13.5 13.5"></polyline>
                    <path d="M16.5 7.5L18 6"></path>
                    <path d="M7.5 7.5L6 6"></path>
                </svg>
            </div>
            <div class="header-info">
                <h2>{{ contact.groom_name }} &amp; {{ contact.bride_name }}'s Wedding</h2>
                <p><span class="online-dot"></span> Wedding Concierge &bull; {{ contact.name }}</p>
            </div>
        </div>

        <!-- Chat History -->
        <div class="chat-history" id="chatBox">
            {% for msg in history %}
            <div class="bubble {% if msg.sender == 'bot' %}bubble-bot{% else %}bubble-user{% endif %}">
                {{ msg.text|replace('\n', '<br>')|safe }}
                <span class="bubble-time">{{ msg.timestamp }}</span>
            </div>
            {% endfor %}
        </div>

        <!-- Quick Action Buttons -->
        <div class="quick-replies-bar" id="quickBar">
            <button type="button" class="quick-chip" onclick="sendQuickText('હા (Yes)')">હા (Yes)</button>
            <button type="button" class="quick-chip quick-chip-outline" onclick="sendQuickText('ના (No)')">ના (No)</button>
        </div>

        <!-- Input Box: Guaranteed visible on all mobile viewports -->
        <form class="input-bar" id="chatForm" onsubmit="handleSend(event)">
            <input type="text" id="userInput" class="text-input" placeholder="અહીં જવાબ લખો..." autocomplete="off" required>
            <button type="submit" class="btn-send" title="Send" aria-label="Send message">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </form>
    </div>

    <script>
        const token = "{{ contact.token }}";
        const chatBox = document.getElementById('chatBox');
        chatBox.scrollTop = chatBox.scrollHeight;

        function sendQuickText(text) {
            document.getElementById('userInput').value = text;
            handleSend(new Event('submit'));
        }

        async function handleSend(e) {
            if (e) e.preventDefault();
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            // Render User Bubble
            appendBubble('user', message, 'Just now');
            input.value = '';

            try {
                const res = await fetch(`/api/guest-chat/${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await res.json();
                if (data.reply) {
                    appendBubble('bot', data.reply, 'Just now');
                }
                if (data.is_completed) {
                    triggerConfetti();
                    document.getElementById('quickBar').style.display = 'none';
                }
            } catch (err) {
                appendBubble('bot', 'ક્ષમા કરશો, સર્વર કનેક્શનમાં ક્ષતિ છે. કૃપા કરીને ફરી પ્રયાસ કરો.', 'Just now');
            }
        }

        function appendBubble(sender, text, time) {
            const div = document.createElement('div');
            div.className = `bubble bubble-${sender}`;
            div.innerHTML = text.replace(/\n/g, '<br>') + `<span class="bubble-time">${time}</span>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        window.addEventListener('resize', () => {
            setTimeout(() => {
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 100);
        });
    </script>
</body>
</html>
