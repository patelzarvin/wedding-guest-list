<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ contact.name }} - લગ્ન આમંત્રણ &amp; RSVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Vadodara:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0c1017;
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', 'Hind Vadodara', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .chat-app-container {
            width: 100%;
            max-width: 520px;
            height: 100vh;
            background: #111622;
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(229, 193, 88, 0.25);
            border-right: 1px solid rgba(229, 193, 88, 0.25);
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.7);
        }

        /* WhatsApp-style Header matching Screen 5 */
        .chat-header {
            background: rgba(18, 24, 38, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1.5px solid rgba(229, 193, 88, 0.35);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 20;
        }
        .avatar {
            width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(135deg, #E5C158 0%, #C49836 100%);
            color: #0E1218;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            box-shadow: 0 0 12px rgba(229, 193, 88, 0.4);
        }
        .header-info h2 {
            font-size: 16px;
            font-weight: 700;
            color: #FFFFFF;
        }
        .header-info p {
            font-size: 12px;
            color: #4ADE80;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .online-dot {
            width: 7px; height: 7px; border-radius: 50%; background: #4ADE80;
            box-shadow: 0 0 6px #4ADE80;
        }

        /* Chat History Area */
        .chat-history {
            flex: 1;
            padding: 18px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: radial-gradient(circle at 50% 20%, #161D2B 0%, #0C1017 100%);
        }

        .bubble {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.55;
            position: relative;
            word-wrap: break-word;
        }
        .bubble-bot {
            align-self: flex-start;
            background: rgba(26, 34, 52, 0.9);
            color: #F8FAFC;
            border: 1px solid rgba(229, 193, 88, 0.25);
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .bubble-user {
            align-self: flex-end;
            background: linear-gradient(135deg, #E5C158 0%, #C49836 100%);
            color: #0E1218;
            font-weight: 600;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(229, 193, 88, 0.35);
        }
        .bubble-time {
            font-size: 10px;
            margin-top: 5px;
            display: block;
            text-align: right;
            opacity: 0.7;
        }

        /* Quick Replies Bar with Tactile Chips matching Screen 5 */
        .quick-replies-bar {
            padding: 12px 14px;
            display: flex;
            gap: 10px;
            background: rgba(18, 24, 38, 0.95);
            border-top: 1px solid rgba(229, 193, 88, 0.2);
            justify-content: center;
        }
        .quick-chip {
            flex: 1;
            background: linear-gradient(135deg, #E5C158 0%, #C49836 100%);
            color: #0E1218;
            font-size: 14px;
            font-weight: 700;
            padding: 10px 16px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(229, 193, 88, 0.3);
            transition: transform 0.1s;
        }
        .quick-chip:active {
            transform: scale(0.96);
        }
        .quick-chip-outline {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(229, 193, 88, 0.35);
            color: #FFFFFF;
        }

        /* Input Form Bar */
        .input-bar {
            padding: 12px 14px;
            background: rgba(18, 24, 38, 0.98);
            border-top: 1px solid rgba(229, 193, 88, 0.25);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .text-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(229, 193, 88, 0.3);
            border-radius: 25px;
            padding: 12px 18px;
            font-size: 14px;
            color: #FFFFFF;
            font-family: inherit;
            outline: none;
        }
        .text-input:focus {
            border-color: #E5C158;
            box-shadow: 0 0 12px rgba(229, 193, 88, 0.25);
        }
        .btn-send {
            width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(135deg, #E5C158 0%, #C49836 100%);
            border: none;
            color: #0E1218;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(229, 193, 88, 0.4);
        }
    </style>
</head>
<body>
    <div class="chat-app-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="avatar">&#128141;</div>
            <div class="header-info">
                <h2>{{ contact.groom_name }} &amp; {{ contact.bride_name }}'s Wedding</h2>
                <p><span class="online-dot"></span> Wedding Concierge &bull; {{ contact.name }}</p>
            </div>
        </div>

        <!-- Chat History -->
        <div class="chat-history" id="chatBox">
            {% for msg in history %}
            <div class="bubble {% if msg.sender == 'bot' %}bubble-bot{% else %}bubble-user{% endif %}">
                {{ msg.text|replace('\n', '<br>')|safe }}
                <span class="bubble-time">{{ msg.timestamp }}</span>
            </div>
            {% endfor %}
        </div>

        <!-- Quick Action Buttons -->
        <div class="quick-replies-bar" id="quickBar">
            <button type="button" class="quick-chip" onclick="sendQuickText('હા (Yes)')">&#10004; હા (Yes)</button>
            <button type="button" class="quick-chip quick-chip-outline" onclick="sendQuickText('ના (No)')">&#10008; ના (No)</button>
        </div>

        <!-- Input Box -->
        <form class="input-bar" id="chatForm" onsubmit="handleSend(event)">
            <input type="text" id="userInput" class="text-input" placeholder="જવાબ લખો..." autocomplete="off" required>
            <button type="submit" class="btn-send">&#10148;</button>
        </form>
    </div>

    <script>
        const token = "{{ contact.token }}";
        const chatBox = document.getElementById('chatBox');
        chatBox.scrollTop = chatBox.scrollHeight;

        function sendQuickText(text) {
            document.getElementById('userInput').value = text;
            handleSend(new Event('submit'));
        }

        async function handleSend(e) {
            if (e) e.preventDefault();
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            // Render User Bubble
            appendBubble('user', message, 'Just now');
            input.value = '';

            try {
                const res = await fetch(`/api/guest-chat/${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await res.json();
                if (data.reply) {
                    appendBubble('bot', data.reply, 'Just now');
                }
                if (data.is_completed) {
                    // Trigger Celebratory Confetti!
                    triggerConfetti();
                    document.getElementById('quickBar').style.display = 'none';
                }
            } catch (err) {
                appendBubble('bot', 'ક્ષમા કરશો, સર્વર કનેક્શનમાં ક્ષતિ છે. કૃપા કરીને ફરી પ્રયાસ કરો.', 'Just now');
            }
        }

        function appendBubble(sender, text, time) {
            const div = document.createElement('div');
            div.className = `bubble bubble-${sender}`;
            div.innerHTML = text.replace(/\n/g, '<br>') + `<span class="bubble-time">${time}</span>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }
    </script>
</body>
</html>
